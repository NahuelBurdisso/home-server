- Server:
    - Pulso:
        href: https://mac-server.tailnet-ejemplo.ts.net:3015
        description: Historia del server, internet y cortes
        icon: mdi-heart-pulse
        siteMonitor: http://host.docker.internal:3015/health
        server: mac
        container: pulso
        # Only the light and counts (api/resumen): nothing private, since Homepage answers the LAN.
        widget:
          type: customapi
          url: http://host.docker.internal:3015/api/resumen
          refreshInterval: 60000
          mappings:
            - field: luz
              label: Estado
              remap:
                - value: verde
                  to: ✓ ok
                - value: amarillo
                  to: "! mirar"
                - value: rojo
                  to: ✗ mal
            - field: internet_24h
              label: Internet 24 h
              format: percent
            - field: internet_cortes_7d
              label: Cortes 7 d
            - field: alertas_24h
              label: Alertas 24 h
    - Mesa:
        href: https://mac-server.tailnet-ejemplo.ts.net:3020
        description: Claude invierte en papel, contra el S&P
        icon: mdi-chart-line
        siteMonitor: http://host.docker.internal:3020/health
        server: mac
        container: mesa
    - AdGuard Home:
        href: https://mac-server.tailnet-ejemplo.ts.net:3000
        description: Ad-blocking DNS
        icon: adguard-home.png
        siteMonitor: http://host.docker.internal:3000
        # No login (Tailscale is the login), so the widget needs no password.
        widget:
          type: adguard
          url: http://host.docker.internal:3000
