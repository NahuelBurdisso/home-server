        icon: glances.png
        siteMonitor: http://host.docker.internal:61208
    - ntfy:
        href: http://alertas.lan
        description: Phone alerts (self-hosted)
        icon: ntfy.png
        siteMonitor: http://host.docker.internal:8091
        server: mac
        container: ntfy
# Live graphs from Glances (the Mac itself, not a container).
- Mac:
    - CPU:
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: cpu
    - Memoria:
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: memory
    - Red (en0):
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: network:en0
    - Disco (I/O):
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: disk:disk0
