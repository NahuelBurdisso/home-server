# Live logs of every container, from the phone or the Mac: https://mac-server.tailnet-ejemplo.ts.net:8080
# Tailscale is the login (tailscale serve passes who you are). Read-only: it talks to Docker
# through socket-proxy, so it can show logs and stats but never start, stop or exec anything.
services:
  dozzle:
    image: amir20/dozzle:v11
    container_name: dozzle
    ports:
      - "127.0.0.1:8080:8080"  # this Mac only: others reach it through tailscale serve
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: Tailscale-User-Login
      DOZZLE_AUTH_HEADER_EMAIL: Tailscale-User-Login
      DOZZLE_AUTH_HEADER_NAME: Tailscale-User-Name
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_HOSTNAME: mac-server
    networks:
      - default
      - dockerapi  # socket-proxy (read-only Docker API)
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 60s
      timeout: 5s
    restart: unless-stopped

networks:
  dockerapi:
    external: true  # created by socket-proxy/compose.yml
