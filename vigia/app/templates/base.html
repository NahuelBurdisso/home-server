<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vigía">
  <title>Vigía</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="apple-touch-icon" href="/static/icon.png">
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
  <nav class="tabs" style="grid-template-columns: repeat(3, 1fr)">
    <a href="/" class="{{ 'on' if page in ('vigilancias', 'vigilancia') }}"><span>◉</span>Vigilancias</a>
    <a href="/guardado" class="{{ 'on' if page in ('guardado', 'item') }}"><span>▤</span>Guardado</a>
    <a href="/ayuda" class="{{ 'on' if page == 'ayuda' }}"><span>?</span>Ayuda</a>
  </nav>
</body>
</html>
