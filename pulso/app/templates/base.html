<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulso">
  {% if page == 'ahora' %}<meta http-equiv="refresh" content="60">{% endif %}
  <title>Pulso · mac-server</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 9h3l2-5 3 9 2-6 1 2h3' fill='none' stroke='%233fb950' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <script src="/static/pulso.js" defer></script>
</head>
<body class="{{ page }}" data-tz="{{ TZ }}">
  <header>
    <a href="/" class="prompt"><span class="user">pulso</span>@mac-server<span class="dim">:~$</span></a>
    <nav>
      <a href="/" class="{{ 'on' if page == 'ahora' }}">ahora</a>
      <a href="/graficos" class="{{ 'on' if page == 'graficos' }}">gráficos</a>
      <a href="/internet" class="{{ 'on' if page == 'internet' }}">internet</a>
      <a href="/servicios" class="{{ 'on' if page in ('servicios', 'servicio') }}">servicios</a>
      <a href="/contenedores" class="{{ 'on' if page in ('contenedores', 'contenedor') }}">contenedores</a>
      <a href="/eventos" class="{{ 'on' if page == 'eventos' }}">eventos</a>
      <a href="/semana" class="{{ 'on' if page == 'semana' }}">semana</a>
      <a href="/red" class="{{ 'on' if page == 'red' }}">red</a>
      <a href="/guardia" class="{{ 'on' if page == 'guardia' }}">guardia</a>
      <a href="/mapa" class="{{ 'on' if page == 'mapa' }}">mapa</a>
      <a href="/atajo" class="{{ 'on' if page == 'atajo' }}">iphone</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
